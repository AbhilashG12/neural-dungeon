[package]
name = "neural-dungeon"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/game-core",
    "crates/game-ai",
    "crates/inference-adapter",
    "crates/dungeon-gen",
    "crates/game-tui"
]
resolver = "2"

[dependencies]
game-tui = { path = "crates/game-tui" }
tracing = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "std"] }
anyhow = { workspace = true }

[workspace.dependencies]
# UI & Terminal
ratatui = "0.26"
crossterm = "0.27"

# Serialization & State
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async & Errors
tokio = { version = "1.37", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
